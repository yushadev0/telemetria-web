<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Telemetria — ileri seviye yarış analitiği. Formula 1 geçmiş telemetrisi ve Assetto Corsa canlı yarış mühendisi."
    />
    <title>Telemetria</title>
    <script>
      // FOUC guard: React mount olmadan önce kayıtlı temayı uygula.
      // Kaynak: localStorage 'tlm_theme' (useUiStore ile aynı anahtar).
      (function () {
        try {
          var mode = localStorage.getItem('tlm_theme');
          var root = document.documentElement;
          if (mode === 'system') {
            // prefers-color-scheme karar versin
            root.removeAttribute('data-theme');
          } else {
            // 'light' / 'dark' / kayıt yok → varsayılan koyu (useUiStore ile aynı)
            root.setAttribute('data-theme', mode === 'light' ? 'light' : 'dark');
          }
          var lang = localStorage.getItem('tlm_lang');
          if (lang === 'tr' || lang === 'en') root.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
